<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Love Story ♡</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      font-family: "Quicksand", sans-serif;
      color: #684754;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.45), transparent 20%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,.4), transparent 20%),
        linear-gradient(145deg, #fbe9ee, #f3dce4);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      position: relative;
    }

    .heart {
      font-size: 85px;
      margin-bottom: 25px;
      animation: heartbeat 2s ease-in-out infinite;
    }

    .small {
      font-family: "Quicksand", sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 15px;
      opacity: .75;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(50px, 13vw, 82px);
      font-weight: 500;
      line-height: 1;
      margin-bottom: 25px;
    }

    .description {
      max-width: 500px;
      font-family: "Cormorant Garamond", serif;
      font-size: 23px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .open-button {
      display: inline-block;
      padding: 17px 38px;
      border-radius: 50px;
      background: #a66d7e;
      color: white;
      text-decoration: none;

      font-family: "Quicksand", sans-serif;
      font-weight: 500;
      font-size: 16px;

      box-shadow: 0 10px 25px rgba(100,60,70,.18);
      transition: .3s;
    }

    .open-button:hover {
      transform: translateY(-4px) scale(1.03);
      background: #955f70;
    }

    .floating {
      position: absolute;
      opacity: .45;
      animation: float 5s ease-in-out infinite;
    }

    .one {
      top: 12%;
      left: 12%;
      font-size: 35px;
    }

    .two {
      top: 27%;
      right: 17%;
      font-size: 25px;
      animation-delay: 1s;
    }

    .three {
      bottom: 13%;
      right: 10%;
      font-size: 38px;
      animation-delay: 2s;
    }

    .four {
      bottom: 23%;
      left: 15%;
      font-size: 22px;
      animation-delay: 3s;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }
  </style>
</head>
