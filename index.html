<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Love Story ♡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: #684754;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.45), transparent 20%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,.4), transparent 20%),
        linear-gradient(145deg, #fbe9ee, #f3dce4);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      position: relative;
    }

    .heart {
      font-size: 85px;
      font-family: Arial, sans-serif;
      font-weight: 200;
      margin-bottom: 35px;
      animation: heartbeat 2s ease-in-out infinite;
    }

    .small {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: .75;
    }

    h1 {
      font-size: clamp(42px, 11vw, 70px);
      font-weight: normal;
      line-height: 1.1;
      margin-bottom: 25px;
    }

    .description {
      max-width: 500px;
      font-size: 21px;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .open-button {
      display: inline-block;
      padding: 17px 38px;
      border-radius: 50px;
      background: #a66d7e;
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 17px;
      box-shadow: 0 10px 25px rgba(100,60,70,.18);
      transition: .3s;
    }

    .open-button:hover {
      transform: translateY(-4px) scale(1.03);
      background: #955f70;
    }

    .floating {
      position: absolute;
      font-family: Arial, sans-serif;
      opacity: .45;
      animation: float 5s ease-in-out infinite;
    }

    .one {
      top: 12%;
      left: 12%;
      font-size: 35px;
    }

    .two {
      top: 27%;
      right: 17%;
      font-size: 25px;
      animation-delay: 1s;
    }

    .three {
      bottom: 13%;
      right: 10%;
      font-size: 38px;
      animation-delay: 2s;
    }

    .four {
      bottom: 23%;
      left: 15%;
      font-size: 22px;
      animation-delay: 3s;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @media (max-width: 500px) {
      .heart {
        font-size: 75px;
        margin-bottom: 25px;
      }

      .description {
        font-size: 19px;
      }

      .open-button {
        padding: 16px 32px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="floating one">♡</div>
    <div class="floating two">♡</div>
    <div class="floating three">♡</div>
    <div class="floating four">♡</div>

    <div class="heart">♡</div>

    <div class="small">
      A little story about us
    </div>

    <h1>
      Our Love Story
    </h1>

    <p class="description">
      A little website about you, me,
      and our beautiful memories.
    </p>

    <!-- TOMBOL MENUJU HALAMAN 2 -->
    <a href="story.html" class="open-button">
      Open Our Story ♡
    </a>

  </main>

</body>
</html>
