<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Untuk Kamu ♥</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet">


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      min-height: 100vh;
      overflow: hidden;

      font-family: "Quicksand", sans-serif;

      color: #684754;

      background:
        radial-gradient(
          circle at center,
          #fffafb 0%,
          #fae9ee 48%,
          #efd5dd 100%
        );
    }


    /* =========================
       COVER
       ========================= */

    .page {

      min-height: 100vh;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 25px;

      position: relative;

      transform:
        translateY(-3vh);
    }


    /* =========================
       BOUQUET
       ========================= */

    .bouquet {

      width: 155px;
      height: 150px;

      margin-bottom: 8px;

      animation:
        gentleFloat 5s ease-in-out infinite;

      filter:
        drop-shadow(
          0 8px 12px
          rgba(110, 70, 80, 0.08)
        );
    }


    .bouquet svg {

      width: 100%;
      height: 100%;

      overflow: visible;
    }


    /* =========================
       BATANG
       ========================= */

    .stem {

      fill: none;

      stroke: #8f7179;

      stroke-width: 1.5;

      stroke-linecap: round;
    }


    /* =========================
       DAUN
       ========================= */

    .leaf {

      fill: none;

      stroke: #8f7179;

      stroke-width: 1.5;

      stroke-linecap: round;

      stroke-linejoin: round;
    }


    /* =========================
       BUNGA
       ========================= */

    .flower-line {

      fill: none;

      stroke: #ad7888;

      stroke-width: 1.5;

      stroke-linecap: round;

      stroke-linejoin: round;
    }


    .flower-center {

      fill: #ad7888;
    }


    /* =========================
       PITA
       ========================= */

    .ribbon-line {

      fill: none;

      stroke: #ad7888;

      stroke-width: 1.6;

      stroke-linecap: round;

      stroke-linejoin: round;
    }


    .ribbon-fill {

      fill:
        rgba(255, 242, 246, 0.55);

      stroke: #ad7888;

      stroke-width: 1.5;
    }


    /* =========================
       JUDUL
       ========================= */

    h1 {

      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(50px, 13vw, 74px);

      /* LEBIH TEBAL */
      font-weight: 700;

      line-height: 1;

      color: #684754;

      margin-bottom: 18px;

      letter-spacing: 0;
    }


    /* =========================
       LOVE PENUH
       ========================= */

    .title-heart {

      display: inline-block;

      font-family:
        Arial,
        sans-serif;

      font-size: 0.58em;

      font-weight: 700;

      color: #a85f76;

      margin-left: 5px;

      vertical-align: 0.08em;

      transform:
        scale(1.05);
    }


    /* =========================
       WORDING
       ========================= */

    .description {

      max-width: 330px;

      font-family:
        "Quicksand",
        sans-serif;

      font-size: 16px;

      font-weight: 400;

      line-height: 1.7;

      letter-spacing: 0.1px;

      color: #795b65;

      margin-bottom: 30px;
    }


    /* =========================
       BUTTON
       ========================= */

    .open-button {

      display: inline-block;

      padding: 14px 28px;

      border-radius: 50px;

      background: #a66d7e;

      color: white;

      text-decoration: none;

      font-size: 13px;

      font-weight: 500;

      letter-spacing: 0.1px;

      box-shadow:
        0 10px 25px
        rgba(100, 60, 70, 0.18);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }


    .open-button:hover {

      transform:
        translateY(-4px);

      box-shadow:
        0 14px 30px
        rgba(100, 60, 70, 0.24);
    }


    /* =========================
       HATI BACKGROUND
       ========================= */

    .floating {

      position: absolute;

      color: #b78391;

      opacity: 0.38;

      font-size: 25px;

      animation:
        floatHeart 5s ease-in-out infinite;
    }


    .one {

      top: 13%;
      left: 12%;
    }


    .two {

      top: 23%;
      right: 13%;

      animation-delay: 1s;
    }


    .three {

      bottom: 14%;
      right: 10%;

      font-size: 34px;

      animation-delay: 2s;
    }


    .four {

      bottom: 20%;
      left: 12%;

      animation-delay: 3s;
    }


    /* =========================
       ANIMASI
       ========================= */

    @keyframes gentleFloat {

      0%, 100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-6px);
      }

    }


    @keyframes floatHeart {

      0%, 100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-12px);
      }

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 500px) {

      .page {

        padding: 20px;

        transform:
          translateY(-3vh);
      }


      .bouquet {

        width: 140px;
        height: 140px;

        margin-bottom: 5px;
      }


      h1 {

        font-size: 54px;

        font-weight: 700;

        margin-bottom: 17px;
      }


      .title-heart {

        font-size: 0.60em;

        margin-left: 4px;
      }


      .description {

        max-width: 310px;

        font-size: 16px;

        line-height: 1.65;

        margin-bottom: 28px;
      }


      .open-button {

        padding: 13px 25px;

        font-size: 13px;
      }


      .floating {

        font-size: 22px;
      }


      .three {

        font-size: 30px;
      }

    }

  </style>

</head>
