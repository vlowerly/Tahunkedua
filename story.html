<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kita, Sejauh Ini ♡</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet">


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family:
        "Quicksand",
        sans-serif;

      color: #684754;

      background:
        radial-gradient(
          circle at center,
          #fffafb 0%,
          #fae9ee 48%,
          #efd5dd 100%
        );
    }


    /* =========================
       HALAMAN
       ========================= */

    .page {

      min-height: 100vh;

      padding:
        55px 25px
        45px;

      text-align: center;

      position: relative;

      overflow: hidden;
    }


    /* =========================
       TULISAN KECIL
       ========================= */

    .small {

      font-family:
        "Quicksand",
        sans-serif;

      font-size: 12px;

      font-weight: 500;

      letter-spacing: 4px;

      color: #9b6d7c;

      margin-bottom: 16px;
    }


    /* =========================
       JUDUL
       ========================= */

    h1 {

      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(48px, 13vw, 68px);

      font-weight: 600;

      line-height: 1;

      color: #684754;

      margin-bottom: 20px;
    }


    /* =========================
       HATI JUDUL
       ========================= */

    .title-heart {

      display: inline-block;

      color: #a85f76;

      font-family:
        Arial,
        sans-serif;

      font-size: 0.58em;

      margin-left: 4px;

      vertical-align: 0.08em;
    }


    /* =========================
       PEMBUKA
       ========================= */

    .intro {

      max-width: 400px;

      margin:
        0 auto 28px;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 21px;

      line-height: 1.65;

      color: #795b65;
    }


    /* =========================
       TANGGAL
       ========================= */

    .date {

      width: min(100%, 340px);

      margin:
        0 auto 32px;

      padding:
        20px 20px;

      background:
        rgba(255, 255, 255, 0.72);

      border:
        1px solid #e0bdc7;

      border-radius: 22px;

      box-shadow:
        0 10px 30px
        rgba(100, 60, 70, 0.06);

      font-size: 12px;

      color: #9b6d7c;

      letter-spacing: 1px;
    }


    .date strong {

      display: block;

      margin-top: 7px;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 31px;

      font-weight: 600;

      letter-spacing: 0;

      color: #684754;
    }


    .date span {

      display: block;

      margin-top: 4px;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 17px;

      font-style: italic;

      color: #8d6571;
    }


    /* =========================
       HATI PEMISAH
       ========================= */

    .heart {

      margin:
        4px 0 22px;

      font-size: 26px;

      color: #ad7888;

      opacity: 0.75;
    }


    /* =========================
       KARTU CERITA
       ========================= */

    .story {

      width: min(100%, 550px);

      margin:
        0 auto 32px;

      padding:
        30px 25px;

      text-align: left;

      background:
        rgba(255, 248, 250, 0.78);

      border-radius: 25px;

      border:
        1px solid
        rgba(217, 173, 185, 0.55);

      box-shadow:
        0 12px 35px
        rgba(100, 60, 70, 0.07);

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 19px;

      line-height: 1.8;

      color: #684754;
    }


    .story .opening {

      text-align: center;

      font-size: 23px;

      font-weight: 600;

      margin-bottom: 20px;

      color: #79505f;
    }


    .story p {

      margin-bottom: 18px;
    }


    .story p:last-child {

      margin-bottom: 0;

      text-align: center;

      font-weight: 600;

      color: #8d5f70;
    }


    /* =========================
       TOMBOL
       ========================= */

    .next {

      display: inline-block;

      padding:
        14px 28px;

      border-radius: 50px;

      background: #a66d7e;

      color: white;

      text-decoration: none;

      font-family:
        "Quicksand",
        sans-serif;

      font-size: 13px;

      font-weight: 500;

      box-shadow:
        0 10px 25px
        rgba(100, 60, 70, 0.16);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }


    .next:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 14px 30px
        rgba(100, 60, 70, 0.22);
    }


    /* =========================
       KEMBALI
       ========================= */

    .back {

      display: block;

      margin-top: 18px;

      color: #98717c;

      text-decoration: none;

      font-family:
        "Quicksand",
        sans-serif;

      font-size: 13px;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 500px) {

      .page {

        padding:
          48px 20px
          35px;
      }


      .small {

        font-size: 11px;

        letter-spacing: 3.5px;

        margin-bottom: 14px;
      }


      h1 {

        font-size: 53px;

        margin-bottom: 18px;
      }


      .intro {

        max-width: 330px;

        font-size: 20px;

        line-height: 1.6;

        margin-bottom: 25px;
      }


      .date {

        margin-bottom: 27px;

        padding: 18px;
      }


      .date strong {

        font-size: 29px;
      }


      .heart {

        margin:
          0 0 19px;

        font-size: 24px;
      }


      .story {

        padding:
          26px 22px;

        font-size: 18px;

        line-height: 1.75;
      }


      .story .opening {

        font-size: 22px;
      }


      .next {

        padding:
          13px 27px;

        font-size: 13px;
      }

    }

  </style>

</head>


<body>


  <main class="page">


    <!-- =========================
         JUDUL
         ========================= -->

    <div class="small">
      SEJAK SAAT ITU
    </div>


    <h1>
