<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kita, Sejauh Ini ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      overflow-x: hidden;
      overflow-y: auto;

      background:
        radial-gradient(
          circle at 20% 15%,
          #fff7fa 0%,
          transparent 30%
        ),

        radial-gradient(
          circle at 85% 80%,
          #f8dfe8 0%,
          transparent 35%
        ),

        linear-gradient(
          135deg,
          #fdf5f8,
          #f5dce5
        );

      color: #6e4b57;

      font-family:
        "Quicksand",
        sans-serif;
    }


    /* =========================
       FLOATING SPARKLES
    ========================= */

    .heart {
      position: fixed;

      color: #c98b9e;

      opacity: .38;

      pointer-events: none;

      z-index: 0;

      font-size: 18px;

      animation:
        floatSparkle linear infinite;
    }

    .h1 {
      left: 8%;
      top: 15%;

      animation-duration: 8s;
    }

    .h2 {
      left: 88%;
      top: 20%;

      animation-duration: 10s;
    }

    .h3 {
      left: 15%;
      top: 75%;

      animation-duration: 9s;
    }

    .h4 {
      left: 80%;
      top: 70%;

      animation-duration: 11s;
    }

    .h5 {
      left: 50%;
      top: 8%;

      animation-duration: 12s;
    }


    @keyframes floatSparkle {

      0% {
        transform:
          translateY(20px)
          rotate(0deg);

        opacity: 0;
      }

      20% {
        opacity: .38;
      }

      70% {
        opacity: .38;
      }

      100% {
        transform:
          translateY(-80px)
          rotate(15deg);

        opacity: 0;
      }

    }


    /* =========================
       MAIN
    ========================= */

    .page {

      position: relative;

      z-index: 2;

      width: 100%;

      max-width: 900px;

      margin: auto;

      padding:
        70px 25px
        70px;

      display: flex;

      flex-direction: column;

      align-items: center;
    }


    /* =========================
       HEADER
    ========================= */

    .eyebrow {

      font-size: 11px;

      letter-spacing: 4px;

      color: #ad7487;

      margin-bottom: 12px;

      animation:
        fadeDown 1s ease;
    }


    h1 {

      margin: 0;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(45px, 9vw, 62px);

      font-weight: 600;

      color: #734d5b;

      line-height: .95;

      text-align: center;

      animation:
        fadeDown 1.2s ease;
    }


    .intro {

      max-width: 480px;

      margin:
        22px auto 0;

      text-align: center;

      font-size: 14px;

      line-height: 1.8;

      color: #92717d;

      animation:
        fadeUp 1.3s ease;
    }


    /* =========================
       POLAROID AREA
    ========================= */

    .memory-area {

      position: relative;

      width: 100%;

      max-width: 650px;

      height: 390px;

      margin-top: 35px;
    }


    /* =========================
       POLAROIDS
    ========================= */

    .polaroid {

      position: absolute;

      width: 175px;

      min-height: 210px;

      padding:
        14px 14px
        20px;

      background:
        rgba(255,255,255,.88);

      box-shadow:
        0 15px 35px
        rgba(123,76,94,.12);

      border-radius: 3px;

      transition:
        transform .5s ease,
        box-shadow .5s ease;
    }


    .polaroid:hover {

      transform:
        translateY(-12px)
        rotate(0deg) !important;

      box-shadow:
        0 25px 45px
        rgba(123,76,94,.18);

      z-index: 10;
    }


    .polaroid-inner {

      height: 145px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
